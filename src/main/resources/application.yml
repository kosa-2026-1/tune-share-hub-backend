spring:
  application:
    name: tune-share-hub-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

mybatis:
  config-location: classpath:config/mybatis_config.xml
  mapper-locations: classpath:mapper/*.xml

jwt:
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}
  secret:
    key: ${JWT_SECRET_KEY:YourJWTSecretKey}
