spring:
  application:
    name: tune-share-hub-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver

mybatis:
  config-location: classpath:mybatis/config/mybatis_config.xml
  mapper-locations: classpath:mybatis/mapper/*.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}
  secret:
    key: ${JWT_SECRET_KEY:YourJWTSecretKey}

spotify:
  client-id: ${SPOTIFY_CLIENT_ID}
  client-secret: ${SPOTIFY_CLIENT_SECRET}
  token-url: https://accounts.spotify.com/api/token
  search-url: https://api.spotify.com/v1/search
  track-url: https://api.spotify.com/v1/tracks

youtube:
  api-key: ${YOUTUBE_API_KEY}
  search-url: https://www.googleapis.com/youtube/v3/search